name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Keep level with the Python on the laptop. Same reasoning as the npm
          # major pin in the JS repos: a version skew between here and local is
          # what turns a green local run into a red CI run.
          python-version: '3.14'
          cache: pip
          # pip caching defaults to globbing requirements.txt, which this repo
          # doesn't have; without this the step errors on "no file matched".
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      # The same gates as `make check`, spelled out so a failure names the
      # step that failed. Keep the two in step: a gate that runs locally and
      # not here is one that only fails after the push.
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # pytest covers the calibration gate (every check must fail on input
      # built to break it, and every check must have a case), so `--self-test`
      # is not run separately here.
      - run: pytest
