name: release

# Cuts a tagged release when, and only when, the version in pyproject.toml
# changes on main. Merging anything else is silent.
#
# The release carries a tarball this workflow builds, rather than GitHub's
# auto-generated source archive. Those are produced on demand and are not
# guaranteed byte-stable, and a checksum that moves breaks every Homebrew
# formula pinned to it. An uploaded asset is immutable.
#
# The job summary prints a ready-to-paste formula with the sha256 filled in.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, so an already-released version can be detected

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Read the declared version
        id: version
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          # Validated before it reaches GITHUB_OUTPUT, a tag name, or a
          # filename. A newline in this string would inject a second output
          # variable, and anything shell-special would land in a path.
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*([abrc]+[0-9]+|\.post[0-9]+|\.dev[0-9]+)?$ ]]; then
            echo "::error::version '$version' is not a plain PEP 440 release string"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged; nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

      # A release must never be cut from a tree that does not pass its own gate,
      # even though CI has already run on the pull request. This costs seconds
      # and removes the case where a merge queue or an admin override lets a red
      # commit reach main.
      - name: Re-run the gate
        if: steps.version.outputs.already_released == 'false'
        run: |
          pip install -e '.[dev]'
          ruff check .
          ruff format --check .
          pytest -q

      - name: Build the tarball
        if: steps.version.outputs.already_released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          # gzip -n drops the timestamp, so the same commit always produces the
          # same bytes and therefore the same sha256.
          git archive --format=tar --prefix="tex2gdoc-${VERSION}/" HEAD \
            | gzip -n > "dist/tex2gdoc-${VERSION}.tar.gz"
          sha256sum "dist/tex2gdoc-${VERSION}.tar.gz" | tee dist/SHA256SUMS

      - name: Publish the release
        if: steps.version.outputs.already_released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          tarball="dist/tex2gdoc-${VERSION}.tar.gz"
          sha=$(cut -d' ' -f1 < <(sha256sum "$tarball"))
          url="https://github.com/${REPO}/releases/download/v${VERSION}/tex2gdoc-${VERSION}.tar.gz"

          printf 'sha256 `%s`\n\nHomebrew formula source:\n\n```ruby\n  url "%s"\n  sha256 "%s"\n```\n' \
            "$sha" "$url" "$sha" > dist/NOTES.md

          gh release create "v${VERSION}" "$tarball" dist/SHA256SUMS \
            --title "v${VERSION}" --notes-file dist/NOTES.md

          {
            echo "## Released v${VERSION}"
            echo
            echo '```ruby'
            echo "  url \"${url}\""
            echo "  sha256 \"${sha}\""
            echo '```'
            echo
            echo "Paste those two lines into the tap formula and commit."
          } >> "$GITHUB_STEP_SUMMARY"
