# Optional local guard — catches secrets before they're committed (the cheapest
# place to stop a leak). `pre-commit install` refuses under this machine's
# global core.hooksPath, so write the shim directly instead:
#
#     printf '#!/bin/sh\nexec pre-commit run\n' > .git/hooks/pre-commit && chmod +x .git/hooks/pre-commit
#
# After that, gitleaks runs automatically on staged changes at every commit,
# using the rules in .gitleaks.toml. Run on demand with: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
